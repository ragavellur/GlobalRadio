<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Connecting Sonos</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      text-align: center;
      padding: 24px;
      max-width: 340px;
    }
    .box .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00c864;
      margin: 0 auto 16px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
    }
    .box .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .box .sub { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
    .box .err { font-size: 13px; color: #ff5555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot" id="dot"></div>
    <div class="title" id="title">Connecting to Sonos</div>
    <div class="sub" id="sub">This window will close automatically.</div>
  </div>

  <script>
    (function () {
      // Default: same URL the app uses. Overridable via the OAuth `state` payload.
      var DEFAULT_FN = 'https://gbnzlxxjswtysmhrjglb.supabase.co/functions/v1/sonos-auth';

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var oauthError = params.get('error');
      var state = params.get('state');

      var title = document.getElementById('title');
      var sub = document.getElementById('sub');
      var dot = document.getElementById('dot');

      function decodeState(s) {
        try {
          var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          return JSON.parse(atob(b64));
        } catch (_) {
          return null;
        }
      }

      function fail(message) {
        dot.style.background = '#ff5555';
        dot.style.animation = 'none';
        title.textContent = 'Connection failed';
        sub.textContent = message;
        try {
          if (window.opener) {
            window.opener.postMessage({ source: 'sonos-callback', status: 'error', message: message }, '*');
          }
        } catch (_) {}
        setTimeout(function () { window.close(); }, 4000);
      }

      if (oauthError) { fail('Sonos authorization failed: ' + oauthError); return; }
      if (!code) { fail('Missing authorization code.'); return; }

      var fn = DEFAULT_FN;
      var redirectUri = window.location.origin + window.location.pathname;
      var parsedState = state ? decodeState(state) : null;
      if (parsedState) {
        if (typeof parsedState.fn === 'string') fn = parsedState.fn;
        if (typeof parsedState.redirectUri === 'string') redirectUri = parsedState.redirectUri;
      }

      // Native flow: the app opened Sonos in a Custom Tab. Bounce back to the
      // globalradio://sonos-callback deep link (carrying code + state) so the
      // app can exchange the code itself.
      if (parsedState && parsedState.native === true) {
        window.location.replace('globalradio://sonos-callback' + window.location.search);
        return;
      }

      fetch(fn, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'token', code: code, redirect_uri: redirectUri })
      })
        .then(function (r) {
          return r.json().then(function (b) { return { ok: r.ok, body: b }; });
        })
        .then(function (res) {
          if (!res.ok || !res.body || !res.body.access_token) {
            throw new Error((res.body && res.body.error) || 'Token exchange failed');
          }
          title.textContent = 'Sonos connected!';
          sub.textContent = 'You can close this window.';
          dot.style.background = '#00c864';
          try {
            if (window.opener) {
              window.opener.postMessage({ source: 'sonos-callback', status: 'success', tokens: res.body }, '*');
            }
          } catch (_) {}
          setTimeout(function () { window.close(); }, 1200);
        })
        .catch(function (err) { fail(err && err.message ? err.message : 'Token exchange failed'); });
    })();
  </script>
</body>
</html>
